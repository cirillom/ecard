    <rect x="85" y="80" width="8" height="8"/>
    <rect x="100" y="70" width="8" height="8"/>
    <rect x="115" y="90" width="8" height="8"/>
    <rect x="130" y="75" width="8" height="8"/>
    <rect x="70" y="100" width="8" height="8"/>
    <rect x="90" y="110" width="8" height="8"/>
    <rect x="110" y="115" width="8" height="8"/>
    <rect x="130" y="105" width="8" height="8"/>
    <rect x="150" y="90" width="8" height="8"/>
    <rect x="75" y="130" width="8" height="8"/>
    <rect x="95" y="140" width="8" height="8"/>
    <rect x="115" y="150" width="8" height="8"/>
    <rect x="135" y="135" width="8" height="8"/>
    <rect x="150" y="150" width="8" height="8"/>
    <rect x="170" y="70" width="8" height="8"/>
